[project]
name = "flylab"
version = "0.1.0"
description = "A modular PyTorch neuromechanical and reinforcement learning workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "numpy>=2.1",
    "pyarrow>=19",
    "httpx>=0.28",
    "mujoco>=3.3",
    "gymnasium>=1.0,<2",
]

[project.urls]
Repository = "https://github.com/hiyuantang/flylab"
Issues = "https://github.com/hiyuantang/flylab/issues"

[dependency-groups]
dev = [
    "brian2>=2.9.0",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/flylab"]

[tool.hatch.build.targets.wheel.force-include]
"frontend/public/models" = "flylab/assets/meshes"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
